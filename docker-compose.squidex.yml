services:
  squidex:
    image: squidex/squidex:latest
    container_name: coworking-squidex
    depends_on:
      - squidex-mongo
    ports:
      - "5000:80"
    environment:
      - URLS__BASEURL=http://localhost:5000
      - URLS__ENFORCEHTTPS=false
      - EVENTSTORE__MONGODB__CONFIGURATION=mongodb://squidex-mongo
      - STORE__MONGODB__CONFIGURATION=mongodb://squidex-mongo
      - IDENTITY__ADMINEMAIL=admin@coworking.local
      - IDENTITY__ADMINPASSWORD=Squidex1!
      - IDENTITY__ADMINCLIENTID=coworking
      - IDENTITY__ADMINCLIENTSECRET=coworking-secret
      - ASSETSTORE__TYPE=Folder
      - ASSETSTORE__FOLDER__PATH=/app/Assets
    volumes:
      - squidex-assets:/app/Assets
    restart: unless-stopped

  squidex-mongo:
    image: mongo:7
    container_name: coworking-squidex-mongo
    volumes:
      - squidex-mongodata:/data/db
    restart: unless-stopped

volumes:
  squidex-assets:
  squidex-mongodata:
